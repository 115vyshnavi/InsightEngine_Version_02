version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: insightengine-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  insightengine-api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: insightengine-api
    ports:
      - "8000:8000"
    environment:
      - VECTOR_DB=qdrant
      - QDRANT_URL=http://qdrant:6333
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - EMBEDDING_MODEL=BAAI/bge-large-en-v1.5
      - TOP_K_RETRIEVAL=15
      - TOP_K_RERANKED=4
    volumes:
      - ../data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  insightengine-ui:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: insightengine-ui
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://insightengine-api:8000
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      - insightengine-api
    restart: unless-stopped

volumes:
  qdrant_storage:
